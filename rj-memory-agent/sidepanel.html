<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJ Advisor Memory Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F5F7FA; color: #1A1A2E; }
    .layout { display: flex; flex-direction: column; height: 100vh; }

    .header {
      background: #003087; padding: 14px 18px;
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0; user-select: none;
    }
    .header-brand { color: #C8A034; font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
    .header-sub   { color: rgba(255,255,255,0.6); font-size: 9px; letter-spacing: 1.8px; }
    .header-badge {
      margin-left: auto; cursor: pointer;
      background: #C8A034; color: #003087;
      font-size: 9px; font-weight: 800;
      padding: 2px 8px; border-radius: 10px; letter-spacing: 0.5px;
    }

    .admin-panel {
      background: #0D1525; padding: 12px 18px;
      flex-shrink: 0; display: none;
      border-bottom: 1px solid #1E3A5F;
    }
    .admin-panel.visible { display: block; }
    .admin-label { font-size: 10px; font-weight: 700; color: #C8A034; letter-spacing: 1px; margin-bottom: 6px; }
    .key-row { display: flex; gap: 8px; }
    .key-input {
      flex: 1; padding: 7px 10px;
      border: 1.5px solid #1E3A5F; border-radius: 5px;
      font-size: 12px; font-family: monospace;
      background: #0A0F1E; color: #C8A034; outline: none;
    }
    .key-input:focus { border-color: #C8A034; }
    .key-save {
      padding: 7px 12px; background: #C8A034; color: #003087;
      border: none; border-radius: 5px; font-size: 11px; font-weight: 800; cursor: pointer;
    }
    .key-status  { font-size: 10px; color: #1A7A3A; margin-top: 5px; display: none; }
    .key-status.visible  { display: block; }
    .key-indicator { font-size: 10px; color: #1A7A3A; display: none; padding: 2px 0; }
    .key-indicator.visible { display: block; }

    .body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

    label { display: block; font-size: 10px; font-weight: 700; color: #64748B; letter-spacing: 1px; margin-bottom: 4px; }

    textarea {
      width: 100%; height: 90px; padding: 10px 12px;
      border: 1.5px solid #E2E8F0; border-radius: 6px;
      font-size: 13px; resize: vertical; outline: none;
      background: white; color: #1A1A2E; line-height: 1.5;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: #003087; }

    .btn {
      width: 100%; padding: 11px; background: #003087; color: white;
      border: none; border-radius: 6px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s; letter-spacing: 0.3px;
    }
    .btn:hover:not(:disabled) { background: #004AAD; }
    .btn:disabled { background: #94A3B8; cursor: not-allowed; }
    .btn-stop { background: #7F1D1D; flex: 0 0 60px; font-size: 12px; }
    .btn-stop:hover:not(:disabled) { background: #991B1B; }

    /* Live steps feed */
    .steps-feed {
      background: #060d1a;
      border-radius: 8px;
      border: 2px dashed #1e4d2b;
      padding: 10px 12px; max-height: 140px; overflow-y: auto;
      display: none; flex-direction: column; gap: 6px;
      animation: __sp_border_blink__ 1.8s ease-in-out infinite;
    }
    @keyframes __sp_border_blink__ {
      0%,100% { border-color: #166534; box-shadow: 0 0 6px rgba(34,197,94,0.15); }
      50%      { border-color: #22c55e; box-shadow: 0 0 14px rgba(34,197,94,0.4); }
    }
    .steps-feed.visible { display: flex; }
    .step-row {
      font-size: 11px; color: #86efac; line-height: 1.5;
      border-bottom: 1px dashed #1a3a27;
      padding-bottom: 4px;
      animation: __sp_row_blink__ 2.4s ease-in-out infinite;
    }
    .step-row:last-child {
      color: #22c55e; border-bottom: none; padding-bottom: 0;
      font-weight: 700;
      animation: __sp_last_blink__ 0.9s ease-in-out infinite;
    }
    @keyframes __sp_row_blink__ {
      0%,100% { opacity: 1; } 50% { opacity: 0.55; }
    }
    @keyframes __sp_last_blink__ {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    .step-detail { color: #4ade80; margin-left: 4px; font-size: 10px; }

    .status { font-size: 11px; color: #64748B; min-height: 16px; }

    .error-box {
      background: #FEF2F2; border: 1px solid #FECACA;
      border-radius: 6px; padding: 10px 12px;
      font-size: 12px; color: #991B1B; display: none;
    }
    .error-box.visible { display: block; }

    .answer-box {
      flex: 1; background: white;
      border: 1.5px solid #E2E8F0; border-left: 4px solid #003087;
      border-radius: 6px; padding: 14px;
      font-size: 13px; line-height: 1.7; color: #1A1A2E;
      display: none; overflow-y: auto; min-height: 180px;
    }
    .answer-box.visible { display: block; }
    .answer-box h3 { font-size: 14px; color: #003087; margin: 10px 0 4px; }
    .answer-box h4 { font-size: 13px; color: #003087; margin: 8px 0 3px; }
    .answer-box ul { padding-left: 16px; margin: 4px 0; }
    .answer-box li { margin: 3px 0; }

    /* Screenshot filmstrip */
    .filmstrip {
      display: none; flex-direction: row; gap: 6px;
      overflow-x: auto; padding: 6px 0;
    }
    .filmstrip.visible { display: flex; }
    .filmstrip-frame {
      flex-shrink: 0; position: relative;
      border-radius: 4px; overflow: hidden;
      border: 2px solid #E2E8F0;
      width: 90px; height: 60px;
      background: #0D1525;
      transition: border-color 0.2s;
    }
    .filmstrip-frame.active { border-color: #C8A034; }
    .filmstrip-frame img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .filmstrip-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.65);
      color: #C8A034; font-size: 8px; font-weight: 700;
      text-align: center; padding: 2px 0; letter-spacing: 0.5px;
    }
    /* Scan line animation on active frame */
    .filmstrip-frame.active::after {
      content: "";
      position: absolute; left: 0; right: 0;
      height: 2px; background: #C8A034;
      animation: scanline 0.9s linear infinite;
      top: 0;
    }
    @keyframes scanline {
      0%   { top: 0%; opacity: 1; }
      90%  { top: 85%; opacity: 1; }
      100% { top: 85%; opacity: 0; }
    }
  </style>
</head>
<body>
<div class="layout">

  <div class="header">
    <div>
      <div class="header-brand">RAYMOND JAMES</div>
      <div class="header-sub">ADVISOR MEMORY AGENT</div>
    </div>
    <div class="header-badge" id="gearTrigger">BETA</div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-label">⚙ DEVELOPER — API KEY</div>
    <div class="key-row">
      <input class="key-input" type="password" id="keyInput" placeholder="sk-ant-api03-..." />
      <button class="key-save" id="saveKeyBtn">Save</button>
    </div>
    <div class="key-status" id="keyStatus">✓ Key saved and active</div>
  </div>

  <div class="body">
    <div class="key-indicator" id="keyIndicator">🔑 API key active</div>

    <div>
      <label>YOUR QUESTION</label>
      <textarea id="question" placeholder="e.g. Given that S&P dropped 5% today, who should I call and draft emails for each client."></textarea>
    </div>

    <div style="display:flex; gap:8px;">
      <button class="btn" id="scanBtn" style="flex:1;">Ask</button>
      <button class="btn btn-stop" id="stopBtn" style="display:none;">Stop</button>
    </div>

    <div class="status" id="status"></div>

    <!-- Screenshot filmstrip -->
    <div class="filmstrip" id="filmstrip"></div>

    <!-- Live agent step feed -->
    <div class="steps-feed" id="steps"></div>

    <div class="error-box"  id="errorBox"></div>
    <div class="answer-box" id="answerBox"></div>
  </div>

</div>
<script src="sidepanel.js"></script>
</body>
</html>
