<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJ Advisor Memory Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F5F7FA;
      color: #1A1A2E;
    }

    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #003087;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header-brand  { color: #C8A034; font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
    .header-sub    { color: rgba(255,255,255,0.6); font-size: 9px; letter-spacing: 1.8px; }
    .header-badge  {
      margin-left: auto;
      background: #C8A034; color: #003087;
      font-size: 9px; font-weight: 800;
      padding: 2px 8px; border-radius: 10px; letter-spacing: 0.5px;
    }

    /* ── Scrollable body ── */
    .body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 10px; font-weight: 700;
      color: #64748B; letter-spacing: 1px;
      margin-bottom: 5px;
    }

    textarea {
      width: 100%; height: 100px;
      padding: 10px 12px;
      border: 1.5px solid #E2E8F0; border-radius: 6px;
      font-size: 13px; resize: vertical; outline: none;
      background: white; color: #1A1A2E; line-height: 1.5;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: #003087; }

    .btn {
      width: 100%; padding: 12px;
      background: #003087; color: white;
      border: none; border-radius: 6px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: #004AAD; }
    .btn:disabled { background: #94A3B8; cursor: not-allowed; }

    .progress-bar {
      height: 4px; background: #E2E8F0; border-radius: 2px;
      overflow: hidden; display: none;
    }
    .progress-bar.visible { display: block; }
    .progress-fill {
      height: 100%; background: #003087; border-radius: 2px;
      transition: width 0.3s ease;
    }

    .status {
      font-size: 12px; color: #64748B;
      min-height: 18px;
    }

    .meta {
      font-size: 10px; color: #94A3B8;
      display: none;
    }
    .meta.visible { display: block; }

    .error-box {
      background: #FEF2F2; border: 1px solid #FECACA;
      border-radius: 6px; padding: 10px 12px;
      font-size: 12px; color: #991B1B;
      display: none;
    }
    .error-box.visible { display: block; }

    /* Answer fills remaining space */
    .answer-box {
      flex: 1;
      background: white;
      border: 1.5px solid #E2E8F0;
      border-left: 4px solid #003087;
      border-radius: 6px; padding: 14px;
      font-size: 13px; line-height: 1.65;
      color: #1A1A2E; white-space: pre-wrap;
      display: none; overflow-y: auto;
      min-height: 200px;
    }
    .answer-box.visible { display: block; }

    .divider { border: none; border-top: 1px solid #E2E8F0; }

    /* API key section */
    .key-row {
      display: flex; gap: 8px; align-items: center;
    }
    .key-input {
      flex: 1; padding: 8px 10px;
      border: 1.5px solid #E2E8F0; border-radius: 6px;
      font-size: 12px; font-family: monospace;
      outline: none; background: white;
    }
    .key-input:focus { border-color: #003087; }
    .key-save {
      padding: 8px 12px;
      background: #C8A034; color: #003087;
      border: none; border-radius: 6px;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
    }
    .key-status { font-size: 10px; color: #1A7A3A; display: none; }
    .key-status.visible { display: block; }
  </style>
</head>
<body>
  <div class="layout">

    <div class="header">
      <div>
        <div class="header-brand">RAYMOND JAMES</div>
        <div class="header-sub">ADVISOR MEMORY AGENT</div>
      </div>
      <div class="header-badge">BETA</div>
    </div>

    <div class="body">

      <!-- API Key (saved to chrome.storage — never committed) -->
      <div>
        <label>ANTHROPIC API KEY</label>
        <div class="key-row">
          <input class="key-input" type="password" id="keyInput" placeholder="sk-ant-api03-..." />
          <button class="key-save" id="saveKeyBtn">Save</button>
        </div>
        <div class="key-status" id="keyStatus">✓ Key saved</div>
      </div>

      <hr class="divider" />

      <!-- Question -->
      <div>
        <label>YOUR QUESTION ABOUT THIS PAGE</label>
        <textarea id="question" placeholder="e.g. Does this client need rebalancing? What risks do you see? Summarize their current allocation."></textarea>
      </div>

      <button class="btn" id="scanBtn">📸 Scan Page &amp; Ask Claude</button>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>

      <div class="status" id="status"></div>
      <div class="meta"   id="meta"></div>

      <div class="error-box"  id="errorBox"></div>
      <div class="answer-box" id="answerBox"></div>

    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
