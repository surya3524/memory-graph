<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJ Advisor Memory Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 420px;
      min-height: 520px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F5F7FA;
      color: #1A1A2E;
    }

    .header {
      background: #003087;
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-brand {
      color: #C8A034;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .header-sub {
      color: rgba(255,255,255,0.65);
      font-size: 10px;
      letter-spacing: 1.5px;
    }
    .header-badge {
      margin-left: auto;
      background: #C8A034;
      color: #003087;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .body { padding: 16px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 0.8px;
      margin-bottom: 5px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 10px 12px;
      border: 1.5px solid #E2E8F0;
      border-radius: 6px;
      font-size: 13px;
      resize: none;
      outline: none;
      background: white;
      color: #1A1A2E;
      line-height: 1.5;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: #003087; }

    .btn {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      background: #003087;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: #004AAD; }
    .btn:disabled { background: #94A3B8; cursor: not-allowed; }

    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #64748B;
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-bar {
      height: 4px;
      background: #E2E8F0;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar.visible { display: block; }
    .progress-fill {
      height: 100%;
      background: #003087;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .meta {
      margin-top: 10px;
      font-size: 10px;
      color: #94A3B8;
      display: none;
    }
    .meta.visible { display: block; }

    .answer-box {
      margin-top: 14px;
      background: white;
      border: 1.5px solid #E2E8F0;
      border-left: 4px solid #003087;
      border-radius: 6px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #1A1A2E;
      white-space: pre-wrap;
      display: none;
      max-height: 280px;
      overflow-y: auto;
    }
    .answer-box.visible { display: block; }

    .error-box {
      margin-top: 12px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      color: #991B1B;
      display: none;
    }
    .error-box.visible { display: block; }

    .divider {
      border: none;
      border-top: 1px solid #E2E8F0;
      margin: 14px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="header-brand">RAYMOND JAMES</div>
      <div class="header-sub">ADVISOR MEMORY AGENT</div>
    </div>
    <div class="header-badge">BETA</div>
  </div>

  <div class="body">
    <label>YOUR QUESTION ABOUT THIS PAGE</label>
    <textarea id="question" placeholder="e.g. Does this client need rebalancing? What risks do you see? Summarize their current allocation."></textarea>

    <button class="btn" id="scanBtn">📸 Scan Page &amp; Ask Claude</button>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <div class="status" id="status"></div>
    <div class="meta" id="meta"></div>

    <div class="error-box" id="errorBox"></div>
    <div class="answer-box" id="answerBox"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
